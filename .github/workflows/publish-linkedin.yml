name: Approved LinkedIn Publisher

on:
  workflow_dispatch:
    inputs:
      approved:
        description: "I explicitly approve scheduling the current content/linkedin-post.txt"
        required: true
        type: boolean
        default: false
      due_at:
        description: "Publish time in ISO 8601, including timezone (example: 2026-10-16T09:00:00+05:30)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out approved draft source
        uses: actions/checkout@v4

      - name: Require explicit approval and validate draft
        env:
          APPROVED: ${{ inputs.approved }}
          DUE_AT: ${{ inputs.due_at }}
        run: |
          if [ "$APPROVED" != "true" ]; then
            echo "Approval was not granted. Nothing was sent to Buffer."
            exit 1
          fi
          if [ ! -f content/linkedin-post.txt ]; then
            echo "Missing content/linkedin-post.txt."
            exit 1
          fi
          if grep -q "DRAFT PLACEHOLDER - DO NOT PUBLISH" content/linkedin-post.txt; then
            echo "Replace the placeholder with the exact reviewed post before publishing."
            exit 1
          fi
          if [ -z "$(tr -d '[:space:]' < content/linkedin-post.txt)" ]; then
            echo "Post text is empty."
            exit 1
          fi
          node -e 'const d = Date.parse(process.env.DUE_AT); if (!Number.isFinite(d) || d <= Date.now()) { console.error("due_at must be a valid future ISO 8601 timestamp including timezone."); process.exit(1); }'

      - name: Schedule approved post in Buffer
        if: ${{ inputs.approved }}
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_LINKEDIN_CHANNEL_ID: ${{ secrets.BUFFER_LINKEDIN_CHANNEL_ID }}
          DUE_AT: ${{ inputs.due_at }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const apiKey = process.env.BUFFER_API_KEY;
          const channelId = process.env.BUFFER_LINKEDIN_CHANNEL_ID;
          const postText = readFileSync("content/linkedin-post.txt", "utf8").trim();
          if (!apiKey || !channelId) {
            throw new Error("Add BUFFER_API_KEY and BUFFER_LINKEDIN_CHANNEL_ID in GitHub Actions secrets first.");
          }

          const query = `
            mutation CreatePost($input: CreatePostInput!) {
              createPost(input: $input) { __typename }
            }
          `;
          const variables = {
            input: {
              channelId,
              assets: [],
              mode: "customScheduled",
              schedulingType: "automatic",
              needsApproval: false,
              saveToDraft: false,
              aiAssisted: true,
              source: "RetryLab GitHub Actions",
              text: postText,
              dueAt: process.env.DUE_AT
            }
          };

          const response = await fetch("https://api.buffer.com", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": `Bearer ${apiKey}`
            },
            body: JSON.stringify({ query, variables })
          });
          const result = await response.json();
          if (!response.ok || result.errors?.length) {
            throw new Error(JSON.stringify(result.errors || result));
          }
          const payload = result.data?.createPost;
          if (payload?.__typename !== "PostActionSuccess") {
            throw new Error("Buffer did not confirm success: " + JSON.stringify(payload));
          }
          console.log("Buffer accepted the approved LinkedIn post for scheduled publishing.");
          NODE
